[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "motulator-gradnet"
version = "0.1.0"
dependencies = [
    "motulator>=0.15.0,<0.16",
    "numpy",
    "matplotlib",
    "torch",
    "tqdm",
]
requires-python = ">=3.12"
authors = [
    {name = "Marko Hinkkanen", email = "marko.hinkkanen@aalto.fi"}
]
description = "Training of gradient-network magnetic models of synchronous machines for motulator"
readme = "README.md"
license = "MIT"
keywords = [
    "flux map",
    "gradient network",
    "machine learning",
    "magnetic model",
    "motor",
    "neural network",
    "saturation",
    "simulation",
    "synchronous machine",
]
classifiers = [
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = [
    "pre-commit",
    "pyright",
    "pytest",
    "ruff",
]
doc = [
    "myst-parser",
    "numpydoc",
    "sphinx",
    "sphinx-autoapi",
    "sphinx-book-theme",
    "sphinx-copybutton",
    "sphinx-gallery",
    "sphinxcontrib-bibtex",
]

[project.urls]
Homepage = "https://github.com/Aalto-Electric-Drives/motulator-gradnet"
Documentation = "https://aalto-electric-drives.github.io/motulator-gradnet/"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "PL", "UP"]
ignore = ["PLR2004"]  # Ignore magic value warnings
pylint = {max-args = 14}

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
skip-magic-trailing-comma = true

[tool.pytest.ini_options]
testpaths = ["tests", "motulator_gradnet"]
addopts = "--doctest-modules"

[tool.pyright]
include = ["motulator_gradnet", "tests", "examples"]
venvPath = "."
venv = ".venv"
exclude = [
    "**/__pycache__",
    "**/.pytest_cache",
]
typeCheckingMode = "standard"
